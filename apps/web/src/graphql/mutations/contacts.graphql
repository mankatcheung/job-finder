mutation CreateContact(
  $applicationId: ID!
  $name: String!
  $role: String
  $email: String
  $phone: String
  $linkedinUrl: String
  $notes: String
) {
  createContact(
    applicationId: $applicationId
    name: $name
    role: $role
    email: $email
    phone: $phone
    linkedinUrl: $linkedinUrl
    notes: $notes
  ) {
    id
    applicationId
    name
    role
    email
    phone
    linkedinUrl
    notes
    createdAt
    updatedAt
  }
}

mutation UpdateContact(
  $id: ID!
  $name: String
  $role: String
  $email: String
  $phone: String
  $linkedinUrl: String
  $notes: String
) {
  updateContact(
    id: $id
    name: $name
    role: $role
    email: $email
    phone: $phone
    linkedinUrl: $linkedinUrl
    notes: $notes
  ) {
    id
    applicationId
    name
    role
    email
    phone
    linkedinUrl
    notes
    createdAt
    updatedAt
  }
}

mutation DeleteContact($id: ID!) {
  deleteContact(id: $id)
}
