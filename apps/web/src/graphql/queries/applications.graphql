query Applications($status: String) {
  applications(status: $status) {
    id
    company
    role
    status
    jobUrl
    location
    salaryRange
    appliedAt
    starred
    source
    followUpAt
    tags
    createdAt
    updatedAt
  }
}

query Application($id: ID!) {
  application(id: $id) {
    id
    company
    role
    status
    jobUrl
    location
    salaryRange
    description
    appliedAt
    starred
    source
    followUpAt
    tags
    createdAt
    updatedAt
  }
}
