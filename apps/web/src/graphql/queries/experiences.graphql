query WorkExperiences {
  workExperiences {
    id
    company
    title
    location
    startDate
    endDate
    description
    createdAt
    updatedAt
  }
}

query Educations {
  educations {
    id
    institution
    degree
    field
    startDate
    endDate
    description
    createdAt
    updatedAt
  }
}

query Skills {
  skills {
    id
    name
    category
    proficiency
    createdAt
  }
}
