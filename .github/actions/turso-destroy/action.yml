name: Destroy Turso database
description: Destroy a Turso database (safe no-op if it does not exist)

inputs:
  db-name:
    description: Name of the Turso database
    required: true
  turso-api-token:
    description: Turso API token
    required: true

runs:
  using: composite
  steps:
    - name: Install Turso CLI
      shell: bash
      run: |
        curl -sSfL https://get.tur.so/install.sh | bash
        echo "$HOME/.turso" >> "$GITHUB_PATH"

    - name: Destroy preview database
      shell: bash
      env:
        TURSO_API_TOKEN: ${{ inputs.turso-api-token }}
      run: |
        if turso db show "${{ inputs.db-name }}" >/dev/null 2>&1; then
          echo "Destroying Turso database ${{ inputs.db-name }}"
          turso db destroy "${{ inputs.db-name }}" --yes
        else
          echo "Turso database ${{ inputs.db-name }} does not exist; nothing to clean up"
        fi
