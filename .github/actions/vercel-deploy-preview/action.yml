name: Deploy Vercel preview
description: Pull environment, build, and deploy a Vercel preview deployment, capturing the output URL

inputs:
  vercel-token:
    description: Vercel API token
    required: true
  vercel-org-id:
    description: Vercel organization ID
    required: true
  vercel-project-id:
    description: Vercel project ID
    required: true
  deploy-env-vars:
    description: Newline-separated KEY=VALUE pairs passed as --env flags to vercel deploy
    required: false
    default: ''
  env-preview-local-content:
    description: Content to write into .vercel/.env.preview.local before building
    required: false
    default: ''

outputs:
  preview-url:
    description: The URL of the deployed preview
    value: ${{ steps.capture-url.outputs.preview-url }}

runs:
  using: composite
  steps:
    - name: Install Vercel CLI
      shell: bash
      run: npm install -g vercel@latest

    - name: Pull Vercel environment settings
      shell: bash
      run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - name: Inject dynamic env vars into preview build
      if: ${{ inputs.env-preview-local-content != '' }}
      shell: bash
      env:
        CONTENT: ${{ inputs.env-preview-local-content }}
      run: echo "$CONTENT" >> .vercel/.env.preview.local

    - name: Build
      shell: bash
      run: vercel build --token="$VERCEL_TOKEN"
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - name: Deploy and capture URL
      id: capture-url
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        DEPLOY_ENV_VARS: ${{ inputs.deploy-env-vars }}
      run: |
        ENV_FLAGS=()
        while IFS= read -r line; do
          [ -n "$line" ] && ENV_FLAGS+=("--env" "$line")
        done <<< "$DEPLOY_ENV_VARS"
        PREVIEW_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" "${ENV_FLAGS[@]}")
        if [[ ! "$PREVIEW_URL" =~ ^https:// ]]; then
          echo "Failed to capture preview URL: $PREVIEW_URL" >&2
          exit 1
        fi
        echo "preview-url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
