name: Post preview URLs to PR
description: Post or update a PR comment with preview deployment URLs

inputs:
  api-url:
    description: API preview URL
    required: true
  web-url:
    description: Web preview URL
    required: true
  pr-number:
    description: PR number (for workflow_dispatch where context.issue.number is unavailable)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Post preview URLs to PR
      uses: actions/github-script@v7
      with:
        script: |
          const apiUrl = '${{ inputs.api-url }}';
          const webUrl = '${{ inputs.web-url }}';
          const issueNumber = '${{ inputs.pr-number }}' || context.issue.number;

          if (!issueNumber) {
            console.log('No PR number available — skipping comment (likely a manual workflow_dispatch run)');
            return;
          }

          const marker = '<!-- trakwyn-preview-deployments -->';
          const body = `${marker}
          Preview deployments for this PR:
          - Web: ${webUrl}
          - API: ${apiUrl}`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
          });

          const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
          }
