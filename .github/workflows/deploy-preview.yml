name: Deploy preview (web + api)

# Deploys non-production preview environments for every PR to main.
#
# Each PR gets its own isolated Turso database. The workflow creates the DB,
# runs Drizzle migrations, deploys the API preview with the DB credentials,
# builds and deploys the web preview against the API preview URL, and
# destroys the database when the PR closes.
#
# How the preview chain works:
#   1. Provision a Turso database named after the PR number.
#   2. Run Drizzle migrations against that database.
#   3. Deploy apps/api as a preview build with DATABASE_URL and
#      DATABASE_AUTH_TOKEN pointing at the provisioned DB, then capture the
#      generated preview URL.
#   4. Build apps/web with VITE_API_URL set to that preview API URL.
#   5. Deploy apps/web as a preview build.
#   6. Post both preview URLs back to the PR as a comment.
#   7. When the PR closes, destroy the Turso database.
#
# Required repository secrets:
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_API_PROJECT_ID
#   VERCEL_WEB_PROJECT_ID
#   TURSO_API_TOKEN
#   TURSO_ORGANIZATION (optional, only if the DB is in a non-default org)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DB_NAME: job-finder-preview-pr-${{ github.event.pull_request.number }}

jobs:
  checks:
    name: Typecheck & test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - run: pnpm typecheck
      - run: pnpm test

  provision-turso-db:
    name: Provision Turso preview DB
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      database-url: ${{ steps.provision-db.outputs.database-url }}
      database-auth-token: ${{ steps.provision-db.outputs.database-auth-token }}
    steps:
      - uses: ./.github/actions/turso-provision
        id: provision-db
        with:
          db-name: ${{ env.DB_NAME }}
          turso-api-token: ${{ secrets.TURSO_API_TOKEN }}

  migrate-turso-db:
    name: Migrate Turso preview DB
    needs: provision-turso-db
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ needs.provision-turso-db.outputs.database-url }}
      DATABASE_AUTH_TOKEN: ${{ needs.provision-turso-db.outputs.database-auth-token }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - run: pnpm --filter @job-finder/api db:migrate

  deploy-api-preview:
    name: Deploy API preview
    needs: [checks, provision-turso-db, migrate-turso-db]
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.api-deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - uses: ./.github/actions/vercel-deploy-preview
        id: api-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
          deploy-env-vars: |
            DATABASE_URL=${{ needs.provision-turso-db.outputs.database-url }}
            DATABASE_AUTH_TOKEN=${{ needs.provision-turso-db.outputs.database-auth-token }}

  deploy-web-preview:
    name: Build & deploy web preview
    needs: [checks, deploy-api-preview]
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.web-deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - uses: ./.github/actions/vercel-deploy-preview
        id: web-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          env-preview-local-content: |
            VITE_API_URL=${{ needs.deploy-api-preview.outputs.preview-url }}/graphql

      - uses: ./.github/actions/post-preview-comment
        with:
          api-url: ${{ needs.deploy-api-preview.outputs.preview-url }}
          web-url: ${{ steps.web-deploy.outputs.preview-url }}

  cleanup-turso-db:
    name: Destroy Turso preview DB
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/turso-destroy
        with:
          db-name: ${{ env.DB_NAME }}
          turso-api-token: ${{ secrets.TURSO_API_TOKEN }}
