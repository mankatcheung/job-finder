name: Test API Deployment (Vercel)

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @job-finder/api db:generate
        # Prisma 7's prisma.config.ts reads DATABASE_URL at config-load time for
        # every CLI invocation, including `generate` (which never touches the
        # database) — a placeholder value satisfies that check.
        env:
          DATABASE_URL: file:./ci-placeholder.db
      - run: pnpm --filter @job-finder/api typecheck
      - run: pnpm --filter @job-finder/api test

  deploy:
    name: Build & deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @job-finder/api db:generate
        # See the `test` job's identical step: `generate` doesn't touch the
        # database, but Prisma 7's prisma.config.ts still requires DATABASE_URL
        # to be resolvable at config-load time.
        env:
          DATABASE_URL: file:./ci-placeholder.db

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings & env vars
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

      - name: Build (runs in this CI environment, not Vercel's cloud build)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

      - name: Deploy prebuilt output to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
