name: Deploy api (Vercel)

# Deploys apps/api to Vercel via the Vercel CLI instead of Vercel's own
# GitHub integration — this workflow is the only thing that triggers a
# deploy, so the `test` job blocking `deploy` is the gate (Vercel's Git
# integration has no built-in test gate; running through Actions gives us
# one). Runs the exact build ourselves (`vercel build`) and uploads the
# result (`vercel deploy --prebuilt`), rather than letting Vercel's cloud
# build run un-reviewed.
#
# IMPORTANT: every `vercel` command below runs from the repo root, NOT
# `apps/api`. Per Vercel's own monorepo docs ("Vercel CLI should not be
# invoked from the subdirectory"), the CLI must run at the monorepo root;
# the project's own Root Directory setting (see setup step 2) is what
# tells Vercel to operate on apps/api.
#
# `vercel build` performs its own install internally but has no idea it
# needs to run `prisma generate` afterwards, so the Prisma client is
# generated explicitly as its own step below, before `vercel build` runs —
# deliberately not a postinstall hook, so this stays a visible, debuggable
# step in the deploy job rather than an implicit side effect of `pnpm
# install`.
#
# src/index.ts is the entrypoint. Vercel's zero-config Fastify support
# auto-detects it via a shallow regex scan for `from "fastify"` in the
# entrypoint file's source text, then wraps the whole app as one Vercel
# Function: https://vercel.com/docs/frameworks/backend/fastify
#
# One-time setup required before this workflow can deploy:
#   1. Create a Vercel project for apps/api (from the repo root, run
#      `vercel link` — not from inside apps/api). Do NOT connect it to
#      this GitHub repo in the Vercel dashboard (Settings -> Git) —
#      leaving it disconnected is what stops Vercel's own integration from
#      also deploying on every push, so this workflow stays the only
#      trigger.
#   2. In the project's Settings -> Build and Deployment -> Root
#      Directory, set it to `apps/api`. This is required, not optional —
#      it's how Vercel knows which part of the monorepo this project is,
#      since the CLI itself is invoked from the repo root (see above).
#   3. `vercel link` (step 1) writes .vercel/project.json (gitignored)
#      containing orgId/projectId — copy those two values into the repo
#      secrets below.
#   4. Attach a Blob store to the project (Storage tab) — this sets
#      BLOB_READ_WRITE_TOKEN as a project env var automatically.
#   5. Set the rest of the project's env vars (Settings -> Environment
#      Variables, Production): everything in apps/api/.env.production
#      (DATABASE_URL, DATABASE_AUTH_TOKEN, JWT_SECRET, JWT_REFRESH_SECRET,
#      TOTP_ENCRYPTION_KEY, CORS_ORIGIN, CRON_SECRET, etc.) — this workflow
#      builds/deploys the code, it does not manage runtime env/secrets.
#   6. Create a Vercel access token (https://vercel.com/account/tokens) and
#      add repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_API_PROJECT_ID.
#      (VERCEL_ORG_ID is shared with deploy-web.yml; VERCEL_API_PROJECT_ID
#      is this project's own ID — the web app is a separate Vercel project
#      with its own VERCEL_WEB_PROJECT_ID.)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-api.yml'

jobs:
  test:
    name: Test api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @job-finder/api db:generate
      - run: pnpm --filter @job-finder/api typecheck
      - run: pnpm --filter @job-finder/api test

  deploy:
    name: Build & deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @job-finder/api db:generate

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Pull Vercel project settings & env vars
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

      - name: Build (runs in this CI environment, not Vercel's cloud build)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

      - name: Deploy prebuilt output to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
