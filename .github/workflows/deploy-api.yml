name: Deploy api (Vercel)

# Deploys apps/api to Vercel via the Vercel CLI instead of Vercel's own
# GitHub integration — this workflow is the only thing that triggers a
# deploy, so the `test` job blocking `deploy` is the gate (Vercel's Git
# integration has no built-in test gate; running through Actions gives us
# one). Runs the exact build ourselves (`vercel build`) and uploads the
# result (`vercel deploy --prebuilt`), rather than letting Vercel's cloud
# build run un-reviewed.
#
# One-time setup required before this workflow can deploy:
#   1. Create a Vercel project for apps/api. Do NOT connect it to this
#      GitHub repo in the Vercel dashboard (Settings -> Git) — leaving it
#      disconnected is what stops Vercel's own integration from also
#      deploying on every push, so this workflow stays the only trigger.
#   2. From apps/api locally, run `vercel link` and select that project.
#      This writes apps/api/.vercel/project.json (gitignored) containing
#      orgId/projectId — copy those two values into the repo secrets below.
#   3. Attach a Blob store to the project (Storage tab) — this sets
#      BLOB_READ_WRITE_TOKEN as a project env var automatically.
#   4. Set the rest of the project's env vars (Settings -> Environment
#      Variables, Production): everything in apps/api/.env.production
#      (DATABASE_URL, DATABASE_AUTH_TOKEN, JWT_SECRET, JWT_REFRESH_SECRET,
#      TOTP_ENCRYPTION_KEY, CORS_ORIGIN, CRON_SECRET, etc.) — this workflow
#      builds/deploys the code, it does not manage runtime env/secrets.
#   5. Create a Vercel access token (https://vercel.com/account/tokens) and
#      add repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-api.yml'

jobs:
  test:
    name: Test api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @job-finder/api db:generate
      - run: pnpm --filter @job-finder/api typecheck
      - run: pnpm --filter @job-finder/api test

  deploy:
    name: Build & deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Pull Vercel project settings & env vars
        working-directory: apps/api
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build (runs in this CI environment, not Vercel's cloud build)
        working-directory: apps/api
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output to Vercel
        working-directory: apps/api
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
